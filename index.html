<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0D0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Michael González">
<meta name="robots" content="noindex">
<title>Michael González | Tu espacio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=6">
</head>
<body>
<div class="stage">
  <div class="app" id="app">

    <section class="login" id="login" aria-label="Acceso">
      <img class="full" src="img/logo-full.png" alt="Michael González. Movimiento, salud, evolución.">
      <h1>Entra a tu espacio</h1>
      <p>Escribe la clave personal que te envió Michael.</p>
      <input id="clave" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Tu clave personal" aria-label="Tu clave personal">
      <div class="err" id="err" role="alert"></div>
      <button class="btn block-btn" id="btnEntrar" data-act="entrar">Entrar</button>
      <p class="small" style="margin-top:18px">Si no tienes clave o la perdiste, escríbele a Michael y te envía una nueva.</p>
    </section>

    <header class="top">
      <img class="mark" src="img/logo-mark.png" alt="Michael González">
    </header>

    <main>
      <section class="screen on" id="s-inicio" aria-label="Inicio"></section>
      <section class="screen" id="s-plan" aria-label="Mi Plan"></section>
      <section class="screen" id="s-entrenar" aria-label="Entrenar"></section>
      <section class="screen" id="s-progreso" aria-label="Progreso"></section>
      <section class="screen" id="s-seguimiento" aria-label="Seguimiento"></section>
      <section class="screen" id="s-pagos" aria-label="Pagos"></section>
      <section class="screen" id="s-perfil" aria-label="Perfil"></section>
    </main>

    <div class="rest" id="rest" hidden>
      <div>Descanso<b id="restTime">0:45</b></div>
      <button data-act="saltarDescanso">Saltar</button>
    </div>

    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">Esta app necesita JavaScript para funcionar.</p></noscript>
<script src="app.js?v=5" defer></script>
</body>
</html>
