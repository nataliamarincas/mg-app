<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0D0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MG Panel">
<meta name="robots" content="noindex">
<title>Michael González | Panel</title>
<link rel="manifest" href="michael.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="michael.css?v=7">
</head>
<body>
<div class="stage">
  <div class="app" id="app">

    <section class="login" id="login" aria-label="Acceso">
      <img class="full" src="../img/logo-full.png" alt="Michael González. Movimiento, salud, evolución.">
      <h1>Tu panel</h1>
      <p>Escribe tu clave personal para ver lo que espera tu decisión.</p>
      <input id="clave" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Tu clave" aria-label="Tu clave">
      <div class="err" id="err" role="alert"></div>
      <button class="btn block-btn" id="btnEntrar" data-act="entrar">Entrar</button>
    </section>

    <header class="top">
      <img class="mark" src="../img/logo-mark.png" alt="Michael González">
      <button class="linkbtn small" data-act="salir" id="btnSalir">Salir</button>
    </header>

    <main>
      <section class="screen on" id="s-hoy" aria-label="Hoy"></section>
      <section class="screen" id="s-resumen" aria-label="Resumen"></section>
      <section class="screen" id="s-planes" aria-label="Planes"></section>
      <section class="screen" id="s-pagos" aria-label="Pagos"></section>
      <section class="screen" id="s-clientes" aria-label="Clientes"></section>
    </main>

    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">Este panel necesita JavaScript para funcionar.</p></noscript>
<script src="michael.js?v=7" defer></script>
</body>
</html>
